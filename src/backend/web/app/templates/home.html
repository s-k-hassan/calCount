{% extends "base.html" %}

{% block title %}CalCount | Home{% endblock %}

{% block content %}
<section class="hero">
    <h1>Signed in as {{ user_email }}.</h1>
    <p>You are signed in and ready to log today's meals.</p>

    <div class="actions">
        <a class="btn btn-primary" href="/logout">Log out</a>
    </div>
</section>

<section class="card" style="margin-top: 1.5rem;">
    <h2>Add a new log</h2>
    <form action="/home/logs" method="post">
        <label for="date">Date</label>
        <input id="date" name="date" type="date" required />

        <label for="food_name">Food</label>
        <input id="food_name" name="food_name" type="text" placeholder="e.g. Chicken salad" required />

        <label for="calories">Calories</label>
        <input id="calories" name="calories" type="number" min="0" required />

        <label for="protein">Protein (g)</label>
        <input id="protein" name="protein" type="number" min="0" required />

        <label for="carbs">Carbs (g)</label>
        <input id="carbs" name="carbs" type="number" min="0" required />

        <label for="fats">Fats (g)</label>
        <input id="fats" name="fats" type="number" min="0" required />

        <button class="btn btn-primary" type="submit">Save log</button>
    </form>
</section>
{% endblock %}
