services:
  nginx-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - api-service
      - web-service

  auth-service:
    build:
      context: ./auth
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${AUTH_DATABASE_URL}

  api-service:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - auth-service
    environment:
      - DATABASE_URL=${API_DATABASE_URL}

  web-service:
    build:
      context: ./web
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - api-service
    environment:
      - DATABASE_URL=${API_DATABASE_URL}

volumes:
  auth_db_data:
  api_db_data:
