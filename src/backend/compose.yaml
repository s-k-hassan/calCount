services:

  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:80" # The ONLY public gateway into your system now
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - crud-service

  auth-service:
    build:
      context: ./auth
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${AUTH_DATABASE_URL} # Remaps to the auth-specific DB string

  crud-service:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - auth-service
    environment:
      - DATABASE_URL=${CRUD_DATABASE_URL} # Remaps to the crud-specific DB string

volumes:
  auth_db_data:
  crud_db_data:
