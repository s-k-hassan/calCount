services:
  nginx-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - otel-net

  auth-service:
    build:
      context: ./auth
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${AUTH_DATABASE_URL}
      - OTEL_SERVICE_NAME=auth-service
    networks:
      - otel-net

  api-service:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - auth-service
    environment:
      - DATABASE_URL=${API_DATABASE_URL}
      - OTEL_SERVICE_NAME=api-service
    networks:
      - otel-net

  web-service:
    build:
      context: ./web
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - OTEL_SERVICE_NAME=web-service
    depends_on:
      - api-service
    networks:
      - otel-net

  otel-collector:
    build:
      context: ./otel-collector
      dockerfile: Dockerfile
    networks:
      - otel-net

volumes:
  auth_db_data:
  api_db_data:

networks:
  otel-net:
    driver: bridge